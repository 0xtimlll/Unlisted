name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly audit so a new advisory in a pinned dependency is noticed (§7).
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # `ignore-scripts` is set in .npmrc; passed here too so the flag is visible in the log
      # and survives anyone running this job with a different npm config (§7).
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: nothing third-party in the export
        run: |
          # Anything the page FETCHES must be same-origin. An <a href> is a link the visitor
          # clicks, not a resource the page loads, so anchors are held to their own rule below —
          # the welcome screen links to this repository.
          # Every HTML file in the export, at any depth: a route folder would escape `out/*.html`.
          if grep -rEoi --include='*.html' "<(script|link|iframe|frame|embed|object|img|source|track|video|audio)[^>]*[[:space:]](src|href|srcset|data|poster)[[:space:]]*=[[:space:]]*[\"']?https?://" out; then
            echo "external resource in HTML"; exit 1; fi
          # Outbound links: only to the repository, and never without noopener.
          LINKS=$(grep -rEohi --include='*.html' "<a[^>]*[[:space:]]href[[:space:]]*=[[:space:]]*[\"']?https?://[^>]*>" out || true)
          if printf '%s' "$LINKS" | grep -vE '^<a href="https://github\.com/'; then
            echo "outbound link to an unexpected host"; exit 1; fi
          if printf '%s' "$LINKS" | grep -v 'rel="noopener noreferrer"'; then
            echo "outbound link without rel=noopener noreferrer"; exit 1; fi
          grep -q "script-src 'self'" out/_headers
          # No inline event handlers or javascript: URLs anywhere in the export.
          if grep -rEoi --include='*.html' "[[:space:]]on[a-z]+[[:space:]]*=|javascript:" out; then
            echo "inline handler or javascript: URL in HTML"; exit 1; fi
      - name: nothing the audit exceptions rely on ships to users (audit-exceptions.json)
        run: |
          if grep -rl --include='*.js' 'toBigIntLE\|StreamValues\|stream-json' out/_next/static; then
            echo "an audit-excepted module reached the bundle"; exit 1; fi
      - name: no key-derivation / multi-chain signer code ships to users (shims/README.md)
        run: |
          if grep -rl --include='*.js' 'tronweb\|getEvmAccountFromMnemonic\|Ed25519Signer\|ed25519-hd-key' out/_next/static; then
            echo "a shimmed LayerZero helper reached the bundle"; exit 1; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-site
          path: out
          retention-days: 7

  live:
    # Read-only tests against public RPCs; manual because public RPCs are flaky.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      # `ignore-scripts` is set in .npmrc; passed here too so the flag is visible in the log
      # and survives anyone running this job with a different npm config (§7).
      - run: npm ci --ignore-scripts
      - run: npx vitest run --project integration tests/integration/probe.live.test.ts tests/integration/decodeTx.live.test.ts
